{% extends "common/base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">

<style>
/* Formulario añadir producto */
.form-wrapper {
  display: flex;
  justify-content: center;
  margin-top: 3rem;
  margin-bottom: 3rem;
}

.form-card {
  background-color: #fff;
  padding: 2rem;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  width: 100%;
  max-width: 600px;
}

.form-card h1 {
  text-align: center;
  margin-bottom: 1.5rem;
  color: #157145;
  font-weight: bold;
}

.form-input, select {
  width: 100%;
  padding: 0.6rem 1rem;
  margin-bottom: 1rem;
  border-radius: 50px;
  border: 2px solid #d1faff;
  outline: none;
  transition: 0.2s;
}

.form-input:focus, select:focus {
  border-color: #28a745;
}

button[type="submit"] {
  width: 100%;
  padding: 0.8rem;
  border: none;
  border-radius: 50px;
  background-color: #28a745;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button[type="submit"]:hover {
  background-color: #157145;
  transform: scale(1.03);
}
</style>

<!-- Formulario añadir producto -->
<div class="form-wrapper">
  <div class="form-card">
    <h1>Agregar Producto</h1>
    <form method="POST" action="{{ url_for('admin.agregar_producto') }}" enctype="multipart/form-data">
      <label>Imagen principal:</label>
      <input type="file" name="imagen_principal" class="form-input" accept="image/*">

      <label>Nombre:</label>
      <input type="text" name="nombre" class="form-input" required>

      <label>Stock:</label>
      <input type="number" name="stock" class="form-input" required>

      <label>Material:</label>
      <input type="text" name="material" class="form-input">

      <label>Precio:</label>
      <input type="number" step="0.01" name="precio" class="form-input" required>

      <label>Color:</label>
      <input type="text" name="color" class="form-input">

      <label>Proveedor:</label>
      <select name="proveedor" class="form-input" required>
        {% for p in proveedores %}
          <option value="{{ p.ID_Proveedor }}">{{ p.NombreEmpresa }}</option>
        {% endfor %}
      </select>

      <label>Categoría:</label>
      <select name="categoria" class="form-input" required>
        {% for c in categorias %}
          <option value="{{ c.ID_Categoria }}">{{ c.NombreCategoria }}</option>
        {% endfor %}
      </select>

      <button type="submit">Agregar Producto</button>
    </form>
  </div>
</div>
{% endblock %}
