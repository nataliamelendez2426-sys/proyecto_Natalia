{% extends "common/base.html" %}

{% block navbar %}
  {% include "common/partials/navbar_cliente.html" %}
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">

<style>
/* === Estilos del contenedor principal === */
.editar-producto-container {
    max-width: 700px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0, 128, 0, 0.15);
    padding: 40px 45px;
    transition: all 0.3s ease;
}

.editar-producto-container:hover {
    transform: scale(1.01);
}

.editar-producto-container h2 {
    text-align: center;
    color: #198754; /* Verde Bootstrap */
    margin-bottom: 25px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

/* === Campos del formulario === */
.form-group label {
    font-weight: 600;
    color: #2f4f2f;
    margin-bottom: 5px;
    display: block;
}

.form-control {
    border-radius: 10px;
    border: 1px solid #c9e7c9;
    padding: 10px 15px;
    font-size: 15px;
    transition: border-color 0.3s, box-shadow 0.3s;
}

.form-control:focus {
    border-color: #198754;
    box-shadow: 0 0 6px rgba(25, 135, 84, 0.3);
}

textarea.form-control {
    resize: none;
}

/* === Imagen previa === */
#imagen-preview {
    display: block;
    margin: 10px auto;
    width: 130px;
    height: 130px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(0, 128, 0, 0.2);
}

/* === Botones === */
.btn {
    border-radius: 10px;
    font-weight: 600;
    padding: 10px 25px;
    transition: 0.3s;
}

.btn-success {
    background-color: #198754;
    border: none;
}

.btn-success:hover {
    background-color: #157347;
    transform: scale(1.03);
}

.btn-secondary {
    background-color: #adb5bd;
    border: none;
}

.btn-secondary:hover {
    background-color: #6c757d;
}

.text-center {
    text-align: center;
}
</style>

<div class="editar-producto-container">
    <h2>Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data"
          action="{{ url_for('admin.editar_producto', id_producto=producto.ID_Producto) }}">

        <div class="form-group mb-3">
            <label for="nombre">Nombre del Producto</label>
            <input type="text" id="nombre" name="nombre" class="form-control"
                   value="{{ producto.NombreProducto }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ producto.Descripcion or '' }}</textarea>
        </div>

        <div class="form-group mb-3">
            <label for="material">Material</label>
            <input type="text" id="material" name="material" class="form-control" value="{{ producto.Material or '' }}">
        </div>

        <div class="form-group mb-3">
            <label for="color">Color</label>
            <input type="text" id="color" name="color" class="form-control" value="{{ producto.Color or '' }}">
        </div>

        <div class="form-group mb-3">
            <label for="precio">Precio Unidad</label>
            <input type="number" step="0.01" id="precio" name="precio" class="form-control"
                   value="{{ producto.PrecioUnidad or 0 }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" class="form-control"
                   value="{{ producto.Stock or 0 }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="proveedor">Proveedor</label>
            <select id="proveedor" name="proveedor" class="form-control" required>
                {% for prov in proveedores %}
                    <option value="{{ prov.ID_Proveedor }}" {% if prov.ID_Proveedor == producto.ID_Proveedor %}selected{% endif %}>
                        {{ prov.NombreProveedor }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group mb-3">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" class="form-control" required>
                {% for cat in categorias %}
                    <option value="{{ cat.ID_Categoria }}" {% if cat.ID_Categoria == producto.ID_Categoria %}selected{% endif %}>
                        {{ cat.NombreCategoria }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group mb-3 text-center">
            <label for="imagen">Imagen Principal</label><br>
            {% if producto.ImagenPrincipal %}
                <img id="imagen-preview" src="{{ url_for('static', filename=producto.ImagenPrincipal) }}" alt="Imagen actual">
            {% endif %}
            <input type="file" id="imagen" name="imagen" class="form-control mt-2">
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success me-2">💾 Guardar Cambios</button>
            <a href="{{ url_for('admin.lista_productos') }}" class="btn btn-secondary">↩ Cancelar</a>
        </div>
    </form>
</div>

{% endblock %}
