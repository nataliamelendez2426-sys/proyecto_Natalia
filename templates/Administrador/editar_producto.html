<!-- editar_producto.html -->
<form method="POST" action="{{ url_for('admin.editar_producto', id_producto=producto.ID_Producto) }}" enctype="multipart/form-data">
    <div class="form-group mb-3">
        <label for="nombre">Nombre del Producto</label>
        <input type="text" id="nombre" name="nombre" class="form-control" value="{{ producto.NombreProducto }}" required>
    </div>

    <div class="form-group mb-3">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ producto.Descripcion|default('') }}</textarea>
    </div>

    <div class="form-group mb-3">
        <label for="precio">Precio</label>
        <input type="number" step="0.01" id="precio" name="precio" class="form-control" value="{{ producto.Precio|default(0.0) }}" required>
    </div>

    <div class="form-group mb-3">
        <label for="stock">Stock</label>
        <input type="number" id="stock" name="stock" class="form-control" value="{{ producto.Stock|default(0) }}" required>
    </div>

    <div class="form-group mb-3">
        <label for="imagen">Imagen Principal</label>
        {% if producto.ImagenPrincipal %}
            <img src="{{ url_for('static', filename=producto.ImagenPrincipal) }}" alt="Imagen actual" style="width:100px; height:100px; object-fit:cover; border-radius:5px; margin-bottom:0.5rem;">
        {% endif %}
        <input type="file" id="imagen" name="imagen" class="form-control">
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{{ url_for('admin.lista_productos') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
