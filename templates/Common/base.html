<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Casa en el Árbol{% endblock %}</title>

 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

 

    {% block extra_css %}{% endblock %}

   
</head>
<body>

  
    {% block navbar %}{% endblock %}

    <main class="mt-4">
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
        {% include "common/partials/footer.html" %}
    {% endblock %}

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

 
    {% block scripts %}{% endblock %}
<button id="chatbot-toggle" class="btn btn-success position-fixed rounded-circle d-flex align-items-center justify-content-center" style="width:56px;height:56px;bottom:30px;right:30px;z-index:1060;">
  <i class="bi bi-chat-dots fs-5"></i>
  </button>
  <div id="chatbot-panel" class="card shadow position-fixed" style="width:360px;max-height:60vh;bottom:100px;right:30px;z-index:1060;display:none;">
    <div class="card-header py-2 d-flex justify-content-between align-items-center">
      <span class="fw-semibold">Asistente</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="chatbot-close">✕</button>
    </div>
    <div class="card-body p-2" style="overflow:auto;">
      <div id="chatbot-messages" class="d-flex flex-column gap-2"></div>
    </div>
    <div class="card-footer p-2">
      <div id="chatbot-suggestions" class="mb-2 d-flex flex-wrap gap-1"></div>
      <div class="input-group input-group-sm">
        <input id="chatbot-input" type="text" class="form-control" placeholder="Pregunta: precio de Mesa Roble" autocomplete="off">
        <button id="chatbot-send" class="btn btn-primary">Enviar</button>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const init = () => {
        const panel = document.getElementById('chatbot-panel');
        const toggle = document.getElementById('chatbot-toggle');
        const closeBtn = document.getElementById('chatbot-close');
        const input = document.getElementById('chatbot-input');
        const send = document.getElementById('chatbot-send');
        const box = document.getElementById('chatbot-messages');
        const sugBox = document.getElementById('chatbot-suggestions');
        if(!panel || !toggle || !closeBtn || !input || !send || !box || !sugBox){ setTimeout(init,50); return; }
        const ASK_URL = "{{ url_for('cliente.chatbot_ask') }}";
        const SUG_URL = "{{ url_for('cliente.chatbot_suggestions') }}";
        const show = () => { panel.style.display = 'block'; input.focus(); };
        const hide = () => { panel.style.display = 'none'; };
        const addMsg = (text, role = 'bot') => {
          const wrap = document.createElement('div');
          wrap.className = role === 'user' ? 'text-end' : 'text-start';
          const b = document.createElement('div');
          b.className = 'd-inline-block px-2 py-1 rounded ' + (role==='user'?'bg-primary text-white':'bg-light');
          b.textContent = text;
          wrap.appendChild(b); box.appendChild(wrap); box.parentElement.scrollTop = box.parentElement.scrollHeight;
        };
        const addItems = (items=[]) => {
          if(!items.length) return;
          const grid=document.createElement('div'); grid.className='row g-2 mt-1';
          items.forEach(it=>{
            const col=document.createElement('div'); col.className='col-12';
            const card=document.createElement('div'); card.className='d-flex align-items-center border rounded p-1';
            const img=document.createElement('img'); img.src=it.imagen; img.alt=it.nombre; img.width=44; img.height=44; img.className='me-2 rounded';
            const body=document.createElement('div'); body.className='flex-grow-1';
            const name=document.createElement('div'); name.className='small fw-semibold'; name.textContent=it.nombre;
            const meta=document.createElement('div'); meta.className='small text-muted'; meta.textContent=`$${(it.precio||0).toFixed(2)} · stock ${it.stock}`;
            const actions=document.createElement('div');
            const link=document.createElement('a'); link.href=it.url || `/cliente/producto/${it.id}`; link.className='btn btn-sm btn-outline-primary ms-2'; link.textContent='Ver';
            body.appendChild(name); body.appendChild(meta); actions.appendChild(link);
            card.appendChild(img); card.appendChild(body); card.appendChild(actions);
            col.appendChild(card); grid.appendChild(col);
          }); box.appendChild(grid); box.parentElement.scrollTop = box.parentElement.scrollHeight;
        };
        const loadSuggestions = async () => {
          try{
            const r=await fetch(SUG_URL); const d=await r.json(); const arr=d.suggestions||[]; sugBox.innerHTML='';
            arr.forEach(s=>{ const btn=document.createElement('button'); btn.type='button'; btn.className='btn btn-sm btn-outline-secondary'; btn.textContent=s; btn.addEventListener('click',()=>{ input.value=s; sendQuery(); }); sugBox.appendChild(btn); });
          }catch(_){ /* ignore */ }
        };
        const sendQuery = async () => {
          const q=(input.value||'').trim(); if(!q) return; addMsg(q,'user'); input.value='';
          try{
            const res = await fetch(ASK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
            const data = await res.json(); addMsg(data.answer||''); addItems(data.items||[]);
          }catch(e){ addMsg('Ocurrió un error. Intenta de nuevo.'); }
        };
        toggle.addEventListener('click',()=> panel.style.display==='none'?show():hide());
        closeBtn.addEventListener('click', hide);
        send.addEventListener('click', sendQuery);
        input.addEventListener('keydown',(e)=>{ if(e.key==='Enter') sendQuery(); });
        loadSuggestions();
      };
      init();
    });
  </script>

  </script>
</body>
</html>
